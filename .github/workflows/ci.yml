name: Verify
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Verify frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      - name: Embed frontend
        run: bash scripts/embed-frontend.sh
      - name: Cache isolated Redis test binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/yunqi-test-redis/bin
          key: redis-test-${{ runner.os }}-${{ runner.arch }}-8.10.2-b9ffee22-libc-v1
      - name: Prepare isolated Redis test server
        env:
          REDIS_VERSION: 8.10.2
          REDIS_SHA256: b9ffee226b5eecdba98a679260dad764b2a4ebd90dce4ad5ac9e9f3eef9c02b3
        run: |
          redis_root="$RUNNER_TEMP/yunqi-test-redis"
          mkdir -p "$redis_root/bin"
          if [ ! -x "$redis_root/bin/redis-server" ]; then
            curl --fail --location --proto '=https' "https://download.redis.io/releases/redis-$REDIS_VERSION.tar.gz" -o "$redis_root/redis.tar.gz"
            echo "$REDIS_SHA256  $redis_root/redis.tar.gz" | sha256sum --check --status
            tar -xzf "$redis_root/redis.tar.gz" -C "$redis_root"
            make -C "$redis_root/redis-$REDIS_VERSION/src" -j2 redis-server MALLOC=libc BUILD_TLS=no
            cp "$redis_root/redis-$REDIS_VERSION/src/redis-server" "$redis_root/bin/redis-server"
          fi
          "$redis_root/bin/redis-server" --version
          echo "YUNQI_TEST_REDIS_SERVER=$redis_root/bin/redis-server" >> "$GITHUB_ENV"
      - name: Verify isolated Redis integration
        working-directory: backend-go
        run: go test -v -p 2 -run '^(TestRedis|TestSharedIdentity|TestSharedBudget)' ./internal/entrybudget ./internal/entrylease ./internal/redisconn .
      - name: Verify backend
        working-directory: backend-go
        run: |
          go test ./...
          go vet ./...
          go build ./...
      - name: Verify shared artifact generators
        run: |
          find scripts -name '*.test.mjs' -print0 | xargs -0 node --test
          node scripts/generate-preset-manifest.mjs --check
      - name: Verify documentation
        working-directory: docs
        run: |
          npm ci
          npm run build
