name: Release
on:
  push:
    tags: ['v*']
permissions:
  actions: read
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_ORGANIZATION_ID: 4ffeb1d3-df31-4323-a3e9-15fecdcbaad2
      SIGNPATH_PROJECT_SLUG: ccx
      SIGNPATH_SIGNING_POLICY_SLUG: release_certificate_2026
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-latest }
          - { os: darwin, arch: amd64, runner: macos-latest }
          - { os: darwin, arch: arm64, runner: macos-latest }
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: windows, arch: arm64, runner: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Build embedded Web console
        run: |
          cd frontend
          bun install --frozen-lockfile
          cd ..
          bash scripts/embed-frontend.sh
      - name: Build service binary
        working-directory: backend-go
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          Yunqi_VERSION: ${{ github.ref_name }}
          Yunqi_COMMIT: ${{ github.sha }}
        run: |
          name="ccx-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then name="$name.exe"; fi
          mkdir -p ../release-assets
          go build -trimpath -buildvcs=false -ldflags "-s -w -linkmode=internal -X main.Version=$Yunqi_VERSION -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X main.GitCommit=$Yunqi_COMMIT" -o "../release-assets/$name" .

      - name: Import macOS signing certificate
        if: matrix.os == 'darwin'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS signing secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ccx-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -d > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Sign macOS service
        if: matrix.os == 'darwin'
        env:
          MACOS_CODESIGN_IDENTITY: 'Developer ID Application: Wang Zhiwei (PZV79TYXCR)'
        run: |
          codesign --force --timestamp --options runtime --sign "$MACOS_CODESIGN_IDENTITY" release-assets/ccx-darwin-${{ matrix.arch }}
          codesign --verify --strict --verbose=4 release-assets/ccx-darwin-${{ matrix.arch }}
      - name: Sign Windows service
        if: matrix.os == 'windows'
        uses: ./.github/actions/signpath-sign
        with:
          file: release-assets/ccx-windows-${{ matrix.arch }}.exe
          output-directory: .signpath/backend-${{ matrix.arch }}
          artifact-name: signpath-backend-windows-${{ matrix.arch }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      - name: Generate checksums after signing
        run: |
          cd release-assets
          name="ccx-${{ matrix.os }}-${{ matrix.arch }}"
          if [ '${{ matrix.os }}' = windows ]; then name="$name.exe"; fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" | awk '{print $1}' > "$name.sha256"
          else
            shasum -a 256 "$name" | awk '{print $1}' > "$name.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccx-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccx-*
          merge-multiple: true
          path: release-assets
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign consolidated checksums
        working-directory: release-assets
        run: |
          sha256sum ccx-linux-amd64 ccx-linux-arm64 ccx-darwin-amd64 ccx-darwin-arm64 ccx-windows-amd64.exe ccx-windows-arm64.exe > checksums.txt
          cosign sign-blob checksums.txt --bundle checksums.txt.sigstore.json --yes
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
