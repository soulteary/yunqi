<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Yunqi 访问管理</title>
<style nonce="__NONCE__">body{font:16px/1.6 system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;color:#172334;background:#f5f7fb}section{background:white;padding:24px;border:1px solid #dce3ee;border-radius:12px;margin:20px 0}h1,h2{line-height:1.3}input,button{font:inherit;padding:9px 12px;border:1px solid #b6c3d5;border-radius:6px}input{max-width:100%;width:340px}button{cursor:pointer;background:#eef3fa;margin:4px}button:disabled{cursor:default;opacity:.55}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #e4e9f1;overflow-wrap:anywhere}#identity,#status{overflow-wrap:anywhere}#status[role=alert]{color:#ad1828}.muted{color:#607086}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#24559a}@media(max-width:650px){td,th{font-size:14px;padding:8px 4px}}</style></head>
<body><header><h1>Yunqi 访问管理</h1><p class="muted">查看授权范围内的渠道。运维与管理员可启停所属渠道，所有权限由服务端校验。</p></header>
<section id="login"><h2>管理凭证</h2><form id="login-form"><label for="credential">访问密钥</label><br><input id="credential" type="password" autocomplete="off" required><button type="submit">验证并进入</button></form><p class="muted">密钥仅保留在当前页面内存中，刷新或退出后清除。</p></section>
<section id="session" hidden><div class="toolbar"><h2>授权身份</h2><button id="logout" type="button">退出</button></div><p id="identity"></p><div class="toolbar"><h2>渠道状态</h2><button id="refresh" type="button">刷新实际状态</button></div><table><thead><tr><th>渠道</th><th>协议</th><th>实际状态</th><th>操作</th></tr></thead><tbody id="channels"></tbody></table><p id="empty" class="muted" hidden>当前没有可访问的渠道。</p></section>
<p id="status" role="status" aria-live="polite"></p>
<script nonce="__NONCE__">
'use strict';
let key='', principal=null, busy=false;
const el=id=>document.getElementById(id);
function message(text,error=false){el('status').textContent=text;el('status').setAttribute('role',error?'alert':'status')}
async function request(path,options={}){
 const headers={'Content-Type':'application/json'};if(key)headers['x-api-key']=key;
 const response=await fetch('/api'+path,{...options,headers,credentials:'same-origin',cache:'no-store'});
 if(!response.ok)throw new Error('request_failed');return response.json();
}
function lock(value){busy=value;document.querySelectorAll('button').forEach(button=>{button.disabled=value})}
async function loadChannels(){
 const result=await request('/access/channels');const rows=el('channels');rows.replaceChildren();
 const channels=Array.isArray(result.channels)?result.channels:[];el('empty').hidden=channels.length>0;
 for(const channel of channels){
  const row=document.createElement('tr');
  for(const text of [channel.name,channel.kind,channel.status]){const cell=document.createElement('td');cell.textContent=String(text??'');row.appendChild(cell)}
  const actions=document.createElement('td');
  if(principal.role==='operator'||principal.role==='admin'){
   for(const [state,label] of [['active','启用'],['suspended','暂停'],['disabled','禁用']]){
    const button=document.createElement('button');button.type='button';button.textContent=label;button.disabled=busy;button.addEventListener('click',()=>setState(channel.channelUid,state));actions.appendChild(button)
   }
  }else actions.textContent='只读';row.appendChild(actions);rows.appendChild(row);
 }
}
async function setState(uid,state){
 lock(true);message('正在更新并核对服务端状态…');
 try{await request('/access/channels/'+encodeURIComponent(uid)+'/state',{method:'PUT',body:JSON.stringify({status:state})});await loadChannels();message('状态已更新，列表已读取服务端实际状态。')}
 catch{try{await loadChannels();message('状态更新失败，列表已按服务端实际状态刷新。',true)}catch{el('channels').replaceChildren();message('操作未完成，且无法确认实际状态。请刷新后核实。',true)}}
 finally{lock(false)}
}
el('login-form').addEventListener('submit',async event=>{
 event.preventDefault();key=el('credential').value;el('credential').value='';lock(true);message('正在验证权限…');
 try{principal=await request('/access/me');el('identity').textContent=String(principal.id)+' · '+String(principal.role);await loadChannels();el('login').hidden=true;el('session').hidden=false;message('已加载授权范围内的渠道。')}
 catch{key='';principal=null;el('channels').replaceChildren();message('无法验证身份或读取授权渠道，请检查管理凭证。',true)}finally{lock(false)}
});
el('refresh').addEventListener('click',async()=>{lock(true);try{await loadChannels();message('已刷新服务端实际状态。')}catch{el('channels').replaceChildren();message('无法读取实际状态，请检查凭证是否过期或已撤销。',true)}finally{lock(false)}});
el('logout').addEventListener('click',()=>{key='';principal=null;el('identity').textContent='';el('channels').replaceChildren();el('credential').value='';el('session').hidden=true;el('login').hidden=false;message('已清除当前页面凭证。')});
</script></body></html>
